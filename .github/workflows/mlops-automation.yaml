name: MLOps pipeline automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testing:
    name: Job 1 - Automated unit testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode repositori
        uses: actions/checkout@v4

      - name: Setup lingkungan python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Eksekusi unit test dengan pytest
        run: |
          pytest tests/ -v

  training:
    name: Job 2 - model training & experiment tracking
    runs-on: ubuntu-latest
    needs: testing
    steps:
      - name: Checkout kode repositori
        uses: actions/checkout@v4

      - name: Setup lingkungan python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull data terbaru via DVC
        run: |
          if dvc pull; then
            echo "DVC pull berhasil menarik dataset dari remote storage."
          else
            echo "DVC remote lokal di luar runner, menyiapkan dataset via pipeline prapemrosesan..."
            python src/prepare_data.py
          fi

      - name: Pelatihan model random forest & logging MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
        run: |
          python src/train.py --model_type random_forest --n_estimators 150 --max_depth 12 --run_name ci_rf_training_run

      - name: Unggah artefak MLflow database & model
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: |
            mlflow.db
            mlruns/
            artifacts/
          retention-days: 2

  registry:
    name: Job 3 - Threshold evaluation & model registry
    runs-on: ubuntu-latest
    needs: training
    steps:
      - name: Checkout kode repositori
        uses: actions/checkout@v4

      - name: Setup lingkungan Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instal dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unduh artefak hasil training
        uses: actions/download-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: .

      - name: Validasi threshold (R2 >= 0.85) & promosi ke staging
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
        run: |
          python src/evaluate.py --threshold 0.85 --tracking_uri "sqlite:///mlflow.db"
