services:
  postgres:
    image: postgres:15-alpine
    container_name: cs2-postgres-db
    restart: always
    environment:
      POSTGRES_DB: mlops_db
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: mlops_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_user -d mlops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: cs2-mlflow-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_STORE_URI: postgresql+psycopg2://mlops_user:mlops_password@postgres:5432/mlops_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlruns
    networks:
      - mlops-net

  model-serving:
    image: cs2-mlflow-serving:v1
    restart: always
    depends_on:
      mlflow-server:
        condition: service_started
    environment:
      MLFLOW_MODELS_WORKERS: "1"
    expose:
      - "8080"
    deploy:
      replicas: 3
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: cs2-nginx-lb
    restart: always
    depends_on:
      model-serving:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mlops-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  mlops-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  mlflow_data:
    driver: local